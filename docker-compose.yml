name: disasterlens
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disasterlens}
      POSTGRES_USER: ${POSTGRES_USER:-disasterlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disasterlens} -d ${POSTGRES_DB:-disasterlens}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-disasterlens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-disasterlens}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      GOOGLE_MAPS_ROUTES_API_KEY: ${GOOGLE_MAPS_ROUTES_API_KEY:-}
      NDMA_CAP_FEED_URL: ${NDMA_CAP_FEED_URL:-https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
      USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
      HAZARD_FETCH_TIMEOUT_SECONDS: ${HAZARD_FETCH_TIMEOUT_SECONDS:-5}
      HAZARD_CACHE_TTL_SECONDS: ${HAZARD_CACHE_TTL_SECONDS:-120}
      NDMA_MAX_CAP_ITEMS: ${NDMA_MAX_CAP_ITEMS:-16}
      USGS_QUERY_RADIUS_KM: ${USGS_QUERY_RADIUS_KM:-500}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/backend}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
